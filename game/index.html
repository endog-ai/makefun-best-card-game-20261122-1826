<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Court — a card duel against the Ash Baron</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="stage">
  <div class="fighter foe">
    <div class="portrait">👹</div>
    <div class="who">
      <div class="name">Ash Baron</div>
      <div class="title">Boss of the Ember Court · 32 life</div>
    </div>
    <div class="lifebar foe" id="foe-life"><div class="fill"></div><div class="num"></div></div>
    <span class="shieldtag" id="foe-shield"></span>
    <div class="ember" id="foe-ember"></div>
  </div>
  <div id="foe-hand"></div>
  <div id="middle">
    <div id="played">
      <div class="played-slot">
        <div class="label">Your last card</div>
        <div id="played-player"></div>
      </div>
      <div class="played-slot">
        <div class="label">Baron's last card</div>
        <div id="played-foe"></div>
      </div>
    </div>
    <div id="log"></div>
  </div>
  <div id="turn-banner"></div>
  <div id="player-hand"></div>
  <div class="fighter you">
    <div class="portrait">🧙</div>
    <div class="who">
      <div class="name">Warden of Embers</div>
      <div class="title">You · 30 life</div>
    </div>
    <div class="lifebar" id="you-life"><div class="fill"></div><div class="num"></div></div>
    <span class="shieldtag" id="you-shield"></span>
    <div class="ember" id="you-ember"></div>
  </div>
  <div id="hud">
    <div class="score" id="score"></div>
    <button id="mute">🔊 Sound</button>
    <button id="end-turn">End Turn ⏎</button>
  </div>
  <div id="overlay"><div class="panel" id="panel"></div></div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
